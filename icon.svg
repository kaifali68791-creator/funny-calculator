<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Funny Calculator">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#0a0a13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.72">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="key" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background (maskable-safe) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- calculator body -->
  <rect x="140" y="104" width="232" height="304" rx="44" fill="#151527" stroke="#2f2f4d" stroke-width="4"/>

  <!-- display -->
  <rect x="164" y="124" width="184" height="76" rx="18" fill="#0e0e19"/>
  <rect x="182" y="148" width="98" height="14" rx="7" fill="#7c5cff"/>
  <rect x="182" y="170" width="60" height="10" rx="5" fill="#9c9cb8" opacity="0.55"/>

  <!-- keypad -->
  <g fill="#2c2c46">
    <rect x="164" y="236" width="52" height="44" rx="14"/>
    <rect x="230" y="236" width="52" height="44" rx="14"/>
    <rect x="296" y="236" width="52" height="44" rx="14"/>
    <rect x="164" y="292" width="52" height="44" rx="14"/>
    <rect x="230" y="292" width="52" height="44" rx="14"/>
    <rect x="296" y="292" width="52" height="44" rx="14"/>
    <rect x="164" y="348" width="52" height="44" rx="14"/>
    <rect x="230" y="348" width="52" height="44" rx="14"/>
  </g>

  <!-- highlighted "=" key -->
  <rect x="296" y="348" width="52" height="44" rx="14" fill="url(#key)"/>
  <g fill="#ffffff">
    <rect x="310" y="361" width="24" height="6" rx="3"/>
    <rect x="310" y="373" width="24" height="6" rx="3"/>
  </g>
</svg>
